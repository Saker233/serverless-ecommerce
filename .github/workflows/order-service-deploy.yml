name: Order Service CI/CD

on:
  pull_request:
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-deploy.yml"
  push:
    branches:
      - main
    paths:
      - "services/order-service/**"
      - ".github/workflows/order-service-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: order-service-dev
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  FUNCTION_NAME: serverless-ecommerce-dev-order
  OUTBOX_FUNCTION_NAME: serverless-ecommerce-dev-order-outbox-publisher

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/order-service

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/order-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build Lambda package
        run: npm run package

      - name: Upload Lambda artifact
        uses: actions/upload-artifact@v4
        with:
          name: order-service-package
          path: services/order-service/order-service.zip
          retention-days: 7

  deploy:
    name: Deploy to dev
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Lambda artifact
        uses: actions/download-artifact@v4
        with:
          name: order-service-package
          path: services/order-service

      - name: Assume AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.ORDER_SERVICE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda code
        working-directory: services/order-service
        run: |
          set -euo pipefail

          wait_for_update() {
            local function_name="$1"

            for attempt in $(seq 1 30); do
              status=$(aws lambda get-function-configuration \
                --function-name "$function_name" \
                --query LastUpdateStatus \
                --output text)

              echo "${function_name} attempt ${attempt}: ${status}"

              case "$status" in
                Successful) return 0 ;;
                Failed)
                  echo "${function_name} update failed"
                  return 1
                  ;;
              esac

              sleep 2
            done

            echo "Timed out waiting for ${function_name}"
            return 1
          }

          deploy_function() {
            local function_name="$1"

            aws lambda update-function-code \
              --function-name "$function_name" \
              --zip-file fileb://order-service.zip

            wait_for_update "$function_name"
          }

          deploy_function "$FUNCTION_NAME"
          deploy_function "$OUTBOX_FUNCTION_NAME"

      - name: Smoke test
        env:
          ORDER_SERVICE_API_URL: ${{ secrets.ORDER_SERVICE_API_URL }}
        run: |
          response=$(curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            "${ORDER_SERVICE_API_URL}/health")

          echo "$response"
          echo "$response" | jq -e '.status == "ok"'
