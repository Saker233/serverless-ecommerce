AWSTemplateFormatVersion: "2010-09-09"
Description: "Bootstrap resources for the serverless-ecommerce dev environment"

Parameters:
  ProjectName:
    Type: String
    Default: serverless-ecommerce
  EnvironmentName:
    Type: String
    Default: dev

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${ProjectName}-${EnvironmentName}-artifacts-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ArtifactBucket:
    Description: "Bucket for CloudFormation templates and Lambda packages"
    Value: !Ref ArtifactBucket
    Export:
      Name: !Sub "${ProjectName}-${EnvironmentName}-artifact-bucket"
