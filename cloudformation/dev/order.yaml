AWSTemplateFormatVersion: "2010-09-09"
Description: "Order service API, outbox publisher, and orders table"

Parameters:
  ProjectName:
    Type: String
    Default: serverless-ecommerce
  EnvironmentName:
    Type: String
    Default: dev
  ArtifactBucket:
    Type: String
  OrderArtifactKey:
    Type: String
    Default: order-service.zip
  LogRetentionInDays:
    Type: Number
    Default: 7
  Issuer:
    Type: String
  Audience:
    Type: String
  EventBusName:
    Type: String
  EventBusArn:
    Type: String
  OidcProviderArn:
    Type: String
  GitHubOwner:
    Type: String
    Default: Saker233
  GitHubRepo:
    Type: String
    Default: serverless-ecommerce
  GitHubBranch:
    Type: String
    Default: main

Resources:
  OrdersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${ProjectName}-${EnvironmentName}-orders"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: CustomerIndex
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true

  OrderFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-order"
      RetentionInDays: !Ref LogRetentionInDays

  OutboxFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${ProjectName}-${EnvironmentName}-order-outbox-publisher"
      RetentionInDays: !Ref LogRetentionInDays

  OrderRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-order-lambda-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${OrderFunctionLogGroup.Arn}:*"
        - PolicyName: orders-table
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:ConditionCheckItem
                  - dynamodb:TransactWriteItems
                Resource:
                  - !GetAtt OrdersTable.Arn
                  - !Sub "${OrdersTable.Arn}/index/*"

  OutboxRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${ProjectName}-${EnvironmentName}-order-outbox-publisher-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${OutboxFunctionLogGroup.Arn}:*"
        - PolicyName: outbox-publisher
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                Resource: !GetAtt OrdersTable.StreamArn
              - Effect: Allow
                Action:
                  - dynamodb:DeleteItem
                Resource: !GetAtt OrdersTable.Arn
              - Effect: Allow
                Action:
                  - events:PutEvents
                Resource: !Ref EventBusArn

  OrderFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-order"
      Runtime: nodejs22.x
      Handler: dist/lambda.handler
      Architectures:
        - arm64
      Role: !GetAtt OrderRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref OrderArtifactKey
      Timeout: 15
      MemorySize: 512
      Environment:
        Variables:
          ENV: !Ref EnvironmentName
          SERVICE_NAME: order-service
          VERSION: dev
          LOG_LEVEL: info
          NODE_ENV: production
          ORDERS_TABLE: !Ref OrdersTable
          EVENT_BUS_NAME: !Ref EventBusName

  OutboxFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${ProjectName}-${EnvironmentName}-order-outbox-publisher"
      Runtime: nodejs22.x
      Handler: dist/outbox/publisher.handler
      Architectures:
        - arm64
      Role: !GetAtt OutboxRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref OrderArtifactKey
      Timeout: 30
      MemorySize: 256
      Environment:
        Variables:
          ENV: !Ref EnvironmentName
          SERVICE_NAME: order-outbox-publisher
          VERSION: dev
          LOG_LEVEL: info
          NODE_ENV: production
          ORDERS_TABLE: !Ref OrdersTable
          EVENT_BUS_NAME: !Ref EventBusName

  OutboxEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt OrdersTable.StreamArn
      FunctionName: !Ref OutboxFunction
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1
      BisectBatchOnFunctionError: true
      FunctionResponseTypes:
        - ReportBatchItemFailures
      Enabled: true

  OrderApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${ProjectName}-${EnvironmentName}-order-api"
      ProtocolType: HTTP

  OrderIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref OrderApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt OrderFunction.Arn
      PayloadFormatVersion: "2.0"

  OrderAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref OrderApi
      Name: cognito-jwt-order
      AuthorizerType: JWT
      IdentitySource:
        - "$request.header.Authorization"
      JwtConfiguration:
        Issuer: !Ref Issuer
        Audience:
          - !Ref Audience

  OrderHealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OrderApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${OrderIntegration}"
      AuthorizationType: NONE

  OrderCreateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OrderApi
      RouteKey: "POST /orders"
      Target: !Sub "integrations/${OrderIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OrderAuthorizer

  OrderListRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OrderApi
      RouteKey: "GET /orders"
      Target: !Sub "integrations/${OrderIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OrderAuthorizer

  OrderGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref OrderApi
      RouteKey: "GET /orders/{id}"
      Target: !Sub "integrations/${OrderIntegration}"
      AuthorizationType: JWT
      AuthorizerId: !Ref OrderAuthorizer

  OrderStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref OrderApi
      StageName: "$default"
      AutoDeploy: true

  OrderApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref OrderFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${OrderApi}/*/*"

  OrderDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: github-actions-order-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref OidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/${GitHubBranch}"
                  - !Sub "repo:${GitHubOwner}@*/${GitHubRepo}@*:ref:refs/heads/${GitHubBranch}"
      Policies:
        - PolicyName: deploy-order-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:UpdateFunctionCode
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                Resource:
                  - !GetAtt OrderFunction.Arn
                  - !GetAtt OutboxFunction.Arn

Outputs:
  OrderApiId:
    Value: !Ref OrderApi
  OrderApiEndpoint:
    Value: !Sub "https://${OrderApi}.execute-api.${AWS::Region}.amazonaws.com"
  OrderFunctionArn:
    Value: !GetAtt OrderFunction.Arn
  OrderFunctionName:
    Value: !Ref OrderFunction
  OutboxFunctionArn:
    Value: !GetAtt OutboxFunction.Arn
  OutboxFunctionName:
    Value: !Ref OutboxFunction
  OrdersTableName:
    Value: !Ref OrdersTable
  OrdersTableStreamArn:
    Value: !GetAtt OrdersTable.StreamArn
  OrderDeployRoleArn:
    Value: !GetAtt OrderDeployRole.Arn
